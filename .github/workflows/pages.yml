name: Publish installer

on:
  workflow_run:
    workflows: ["Vencord Forge"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - i
      - packaging/flatpak/**
      - site/**
      - forge.json
      - patches/series
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: |
          mkdir _site
          cp -r site/. _site/
          cp i _site/i
          # Self-hosted Flatpak repository (built by the Vencord Forge workflow) + install files.
          if git fetch -q origin flatpak-repo; then git archive origin/flatpak-repo repo | tar -x -C _site --transform 's,^repo,flatpak,'; fi
          python3 packaging/flatpak/gen-install-files.py _site/flatpak
          cp forge.json _site/forge.json
          cp patches/series _site/series
          # Link previews (Discord, Telegram, X) need a raster image; render it from the SVG card.
          sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core >/dev/null
          rsvg-convert -w 1200 -h 630 site/brand/og-card.svg -o _site/og.png
      - uses: actions/upload-pages-artifact@v3
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
