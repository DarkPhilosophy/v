name: Vencord Forge

# Builds Forge for Linux and Windows on every change, keeps the generated README blocks in sync,
# and publishes a release whenever forge/Cargo.toml's version has no release yet.
#
# Releases and README commits are made with the repository owner's token (secret RELEASE_TOKEN,
# a fine-grained PAT with Contents: read and write on this repository), so they are authored by
# the owner and not by github-actions[bot]. Without that secret those two steps fail loudly
# instead of silently falling back to the bot.

on:
  push:
    branches: [main]
    paths:
      - forge/**
      - forge.json
      - patches/**
      - core/src/**
      - scripts/**
      - .github/README.md
      - .github/workflows/forge.yml
  pull_request:
  workflow_dispatch:
    inputs:
      republish:
        description: Rebuild and replace the assets of the current version's release (tag moves to this commit)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: ""
          - os: windows-latest
            name: windows-x86_64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --locked --release -p vforge -p vencord-forge
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/vforge${{ matrix.exe }} --help
          ./target/release/vforge${{ matrix.exe }} detect
          ./target/release/vforge${{ matrix.exe }} list --source ..
      - name: Package (plain executables)
        shell: bash
        run: |
          mkdir -p ../dist
          # The app is self-contained: run without arguments it opens the window, with arguments
          # it is the command line (the privileged steps it runs through pkexec included).
          cp target/release/vencord-forge${{ matrix.exe }} ../dist/vencord-forge-${{ matrix.name }}${{ matrix.exe }}
          cp target/release/vforge${{ matrix.exe }} ../dist/vforge-${{ matrix.name }}${{ matrix.exe }}
      - name: Package (AppImage)
        if: runner.os == 'Linux'
        run: |
          app=../dist/AppDir
          mkdir -p "$app/usr/bin"
          cp target/release/vencord-forge "$app/usr/bin/"
          ln -s usr/bin/vencord-forge "$app/AppRun"
          cp gui/assets/icon.svg "$app/vencord-forge.svg"
          ln -s vencord-forge.svg "$app/.DirIcon"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Vencord Forge' 'Comment=Build and install Vencord with your plugins into Discord' 'Exec=vencord-forge' 'Icon=vencord-forge' 'Terminal=false' 'Categories=Utility;Network;' > "$app/vencord-forge.desktop"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream "$app" ../dist/vencord-forge-x86_64.AppImage
          rm -rf "$app"
          ../dist/vencord-forge-x86_64.AppImage --appimage-extract-and-run --help >/dev/null || APPIMAGE_EXTRACT_AND_RUN=1 ../dist/vencord-forge-x86_64.AppImage --help
      - uses: actions/upload-artifact@v4
        with:
          name: vencord-forge-${{ matrix.name }}
          path: dist/*

  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge
      - run: cargo build --locked -p vforge
        working-directory: forge
      - name: Rust engine matches the shell installer byte for byte
        run: sh forge/tests/equivalence.sh
      - name: Shell installer tests
        run: |
          sh tests/update-persistence.sh
          sh tests/package-vencord-asar.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.event_name == 'push' && secrets.RELEASE_TOKEN || github.token }}
      - name: README is generated from forge.json, patches/series and the plugins
        if: github.event_name != 'push'
        run: python3 scripts/gen-docs.py --check
      - name: Regenerate and commit as the owner
        if: github.event_name == 'push'
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          python3 scripts/gen-docs.py
          if git diff --quiet; then echo "README up to date"; exit 0; fi
          if [ "$HAS_TOKEN" != true ]; then echo "::error::RELEASE_TOKEN secret is not set; refusing to commit as a bot"; exit 1; fi
          git config user.name "DarkPhilosophy"
          git config user.email "19309990+DarkPhilosophy@users.noreply.github.com"
          git commit -am "docs: regenerate README from forge.json"
          git push origin HEAD:${{ github.ref_name }}

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, equivalence]
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.exists.outputs.exists == 'false' || inputs.republish }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import importlib.util as u; s=u.spec_from_file_location('g','scripts/gen-docs.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.forge_version())")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=forge-v$version" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.exists == 'false' || inputs.republish
        with:
          path: dist
          merge-multiple: true
      - name: Publish release as the owner
        if: steps.exists.outputs.exists == 'false' || inputs.republish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EXISTS: ${{ steps.exists.outputs.exists }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASE_TOKEN secret is not set; refusing to publish as a bot"; exit 1; fi
          cd dist && chmod +x vencord-forge-* vforge-* && sha256sum vencord-forge-* vforge-* > SHA256SUMS
          assets=$(ls vencord-forge-* vforge-* SHA256SUMS)
          if [ "$EXISTS" = true ]; then
            # Same version rebuilt: point the tag at this commit, replace every asset.
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" -f sha="${{ github.sha }}" -F force=true >/dev/null
            for old in $(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name'); do
              echo "$assets" | grep -qx "$old" || gh release delete-asset "$TAG" "$old" -R "${{ github.repository }}" -y
            done
            gh release upload "$TAG" $assets -R "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" $assets -R "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Vencord Forge $VERSION" --generate-notes \
              --notes "Vencord Forge $VERSION for Linux and Windows. Download one file and run it: vencord-forge-*.AppImage or vencord-forge-linux-x86_64 on Linux (chmod +x first), vencord-forge-windows-x86_64.exe on Windows. vforge-* is the same engine as a command line."
          fi

  flatpak:
    # Packages the released Linux binary as a Flatpak: a .flatpak bundle on the release, and a
    # signed repository published at https://darkphilosophy.github.io/v/flatpak/ (branch flatpak-repo).
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: vencord-forge-linux-x86_64
          path: dist
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak flatpak-builder >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          KEY=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          cp dist/vencord-forge-linux-x86_64 packaging/flatpak/
          # Start from the published repository so existing users get updates, not a new history.
          git fetch origin flatpak-repo && git worktree add pub origin/flatpak-repo || { mkdir -p pub; }
          mkdir -p pub/repo
          [ -f pub/repo/config ] || ostree init --mode=archive-z2 --repo=pub/repo
          # git keeps no empty directories; OSTree needs these to exist.
          mkdir -p pub/repo/refs/heads pub/repo/refs/remotes pub/repo/refs/mirrors pub/repo/tmp pub/repo/state pub/repo/extensions
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=pub/repo --gpg-sign="$KEY" --default-branch=stable build packaging/flatpak/io.github.DarkPhilosophy.v.yml
          flatpak build-update-repo --gpg-sign="$KEY" --generate-static-deltas --prune --prune-depth=3 pub/repo
          flatpak build-bundle --gpg-sign="$KEY" --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            pub/repo dist/vencord-forge.flatpak io.github.DarkPhilosophy.v stable
          echo "KEY=$KEY" >> "$GITHUB_ENV"
      - name: Publish bundle and repository as the owner
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' forge/Cargo.toml | head -n1)
          gh release upload "forge-v$version" dist/vencord-forge.flatpak --clobber -R "${{ github.repository }}"
          cd pub
          git config user.name "DarkPhilosophy"
          git config user.email "19309990+DarkPhilosophy@users.noreply.github.com"
          if [ ! -e .git ]; then git init -q -b flatpak-repo .; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"; fi
          git add -A repo
          git commit -qm "flatpak: Vencord Forge $version" || exit 0
          git push origin HEAD:flatpak-repo

