# Packaging for the self-hosted Flatpak repository (https://darkphilosophy.github.io/v/flatpak/).
# Not a Flathub submission: Flathub requires manifests written without AI assistance.
#
# Packages the release binary built by CI (vencord-forge-linux-x86_64), which needs only glibc.
app-id: io.github.DarkPhilosophy.v
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: vencord-forge
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Downloads Vencord's source, Node.js, pnpm and OpenAsar to build the selected Vencord.
  - --share=network
  # The Vencord runtime and the saved plugin selection, which Discord loads from here.
  - --filesystem=xdg-config/Vencord:create
  # Discord's own files are outside the sandbox (/opt, /var/lib/flatpak, ~/.config/discord*):
  # detecting Discord and replacing its startup files run on the host through flatpak-spawn,
  # with pkexec when they are system-owned.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: vencord-forge
    buildsystem: simple
    build-commands:
      - install -Dm755 vencord-forge-linux-x86_64 /app/bin/vencord-forge
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.DarkPhilosophy.v.svg
      - install -Dm644 io.github.DarkPhilosophy.v.desktop -t /app/share/applications
      - install -Dm644 io.github.DarkPhilosophy.v.metainfo.xml -t /app/share/metainfo
    sources:
      - type: file
        path: vencord-forge-linux-x86_64
      - type: file
        path: ../../forge/gui/assets/icon.svg
      - type: file
        path: io.github.DarkPhilosophy.v.desktop
      - type: file
        path: io.github.DarkPhilosophy.v.metainfo.xml
