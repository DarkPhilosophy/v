<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V · Studio</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0a0b0f;--bg2:#0f1016;--panel:rgba(255,255,255,.035);--panel-solid:#14151c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#eceef5;--muted:#8d90a3;--hl:#eb6f92;--hl2:#f5c211;--r:16px;color-scheme:dark}
html,body{height:100%}
body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
  background:radial-gradient(1200px 600px at 70% -10%,rgba(235,111,146,.12),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(245,194,17,.07),transparent 60%),var(--bg)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
button:hover{background:rgba(255,255,255,.07);border-color:var(--line2)}
button:active{transform:translateY(1px)}
button.on{border-color:var(--hl);background:rgba(235,111,146,.14)}
button.primary{background:linear-gradient(135deg,#eb6f92,#c9567a);border:0;color:#fff;font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(10,11,15,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px;margin-right:auto}
.brand .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--panel-solid);border:1px solid var(--line)}
.brand .dot svg{width:22px;height:22px}
.brand small{color:var(--muted);font-weight:500}
.top .bar{display:flex;gap:6px;flex-wrap:wrap}
/* app grid */
.app{display:grid;grid-template-columns:220px minmax(420px,1fr) 400px;gap:18px;padding:18px 20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px)}
.nav{position:sticky;top:76px;padding:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 96px);overflow:auto}
.nav .group{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:12px 10px 6px}
.nav button{text-align:left;border-color:transparent;background:transparent;border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:rgba(235,111,146,.13);border-color:rgba(235,111,146,.45)}
.nav button em{font-style:normal;font-size:11px;color:var(--muted)}
/* canvas */
.canvas{display:grid;gap:14px}
.stage-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stage{position:relative;aspect-ratio:1;border-radius:var(--r);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}
.stage.dark{background:repeating-conic-gradient(#12131a 0 25%,#0e0f15 0 50%) 0 0/22px 22px}
.stage.light{background:#f3f3f7}
.stage svg{width:78%;height:78%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
.stage.light svg{filter:drop-shadow(0 18px 30px rgba(0,0,0,.12))}
.stage .tag{position:absolute;left:12px;top:10px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stage.light .tag{color:#7a7c8c}
.lk-row{display:grid;grid-template-columns:1fr;gap:14px}
.lk{border-radius:var(--r);display:grid;place-items:center;min-height:150px;padding:22px;border:1px solid var(--line);overflow:hidden}
.lk.dark{background:#0d0e13}
.lk.light{background:#f3f3f7}
.lk svg{max-width:100%;height:auto;max-height:110px}
.sizes{display:flex;gap:18px;align-items:end;padding:14px 18px}
.sizes figure{margin:0;text-align:center;font-size:10px;color:var(--muted)}
/* inspector */
.inspector{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:16px}
.inspector h2{margin:0 0 4px;font-size:16px}
.hint{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.custom{display:flex;flex-direction:column;gap:2px}
.custom:empty{display:none}
.custom b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin:12px 0 4px}
.custom br{display:none}
.custom label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;color:#c9cbd8;font-size:13px}
.custom input[type=range]{width:170px;accent-color:var(--hl)}
.custom input[type=text],.custom select{width:190px;background:var(--panel-solid);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.custom input[type=color]{width:38px;height:28px;border-radius:8px;border:1px solid var(--line2);padding:0;background:none;cursor:pointer}
.custom input[type=checkbox]{accent-color:var(--hl);width:16px;height:16px}
.custom > button{align-self:flex-start;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grid.wide{grid-template-columns:1fr}
.opt{background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:4px;justify-items:center;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.opt:hover{transform:translateY(-2px);border-color:var(--line2)}
.opt.on{border-color:var(--hl);background:rgba(235,111,146,.08);box-shadow:0 0 0 1px var(--hl) inset}
.opt svg{width:84px;height:84px}
.opt small{color:var(--muted);font-size:10.5px;text-align:center;line-height:1.2}
.swatch{width:100%;height:84px;border-radius:9px;display:grid;place-items:center}
.swatch svg{width:70px;height:70px}
.opt .lkc{width:100%;display:grid;place-items:center;min-height:90px;background:#0b0c10;border-radius:9px;padding:8px}
.opt .lkc svg{max-width:100%;height:auto;max-height:70px}
/* saved + compare */
.saved{display:flex;gap:8px}
.slot{position:relative;width:40px;height:40px;border-radius:10px;border:1px dashed var(--line2);display:grid;place-items:center;cursor:pointer;background:var(--panel)}
.slot svg{width:34px;height:34px}
.slot .x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;padding:0;font-size:9px;line-height:14px;border-radius:50%;display:none}
.slot:hover .x{display:block}
.slot span{color:var(--muted);font-size:12px}
.compare{padding:0 20px 30px}
.compare h3{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.row{display:flex;gap:14px;flex-wrap:wrap}
.cmp{display:grid;gap:6px;justify-items:center;font-size:11px;color:var(--muted)}
.cmp .pair{display:flex;gap:6px}
.cmp .pair div{width:96px;height:96px;border-radius:12px;display:grid;place-items:center}
.cmp svg{width:80px;height:80px}
.dark{background:#0b0c10}
.light{background:#f2f2f6}
#cur{display:none}
@media (max-width:1250px){.app{grid-template-columns:200px 1fr}.inspector{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.stage-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="dot" id="brand-dot"></span>V Studio <small>icon &amp; logo</small></div>
  <div class="bar">
    <button id="undo" title="Ctrl+Z">↶ Înapoi</button>
    <button id="random">Aleator</button>
    <button id="reset">Reset</button>
    <button id="focus" class="on" title="Estompează celelalte elemente în galerie">Focus</button>
    <button id="bgmode">Fundal</button>
    <button id="copy">Copiază SVG</button>
    <button id="link">Copiază link</button>
    <button id="svg">Iconă SVG</button>
    <button id="png">Iconă PNG</button>
    <button id="lsvg" class="primary">Logo SVG</button>
    <button id="lpng">Logo PNG</button>
  </div>
  <div class="saved" id="saved" title="Salvate: click pe ★ salvează, click pe iconă încarcă"></div>
</div>
<div class="app">
  <nav class="card nav" id="tabs"></nav>
  <main class="canvas">
    <div class="stage-row">
      <div class="stage dark" id="stage-dark"></div>
      <div class="stage light" id="stage-light"></div>
    </div>
    <div class="lk-row">
      <div class="lk dark" id="logo-dark"></div>
      <div class="lk light" id="logo-light"></div>
    </div>
    <div class="card sizes" id="sizes"></div>
    <div id="cur"></div>
  </main>
  <aside class="card inspector">
    <h2 id="insp-title"></h2>
    <div class="hint" id="hint"></div>
    <div class="custom" id="custom"></div>
    <div class="grid" id="grid"></div>
  </aside>
</div>
<section class="compare">
  <h3>Comparație: curent și salvate</h3>
  <div class="row" id="compare"></div>
</section>

<script>
// Every part shares one 256×256 coordinate system, so any variant of any part composes with any
// other: the mark is just the parts drawn in ORDER. Arms are drawn for the left side; the right
// arm reuses the same shapes mirrored, so left and right can differ.
const T = 52, B = 204, L = 46, R = 210, MID = 128;          // V frame: top, bottom (notch), left, right
const f = n => Math.round(n * 10) / 10;
const pts = a => a.map(p => `${f(p[0])},${f(p[1])}`).join(" ");

/** Point on the left arm's centre line at t (0 = top, 1 = notch). */
function along(t, w) { const x0 = L + w / 2, x1 = MID; return [x0 + (x1 - x0) * t, T + (B - T) * t]; }
/** Parallelogram slice of the left arm between t0 and t1, cut horizontally like the veskforge F. */
function slice(t0, t1, w) {
  const [a, ay] = along(t0, w), [b, by] = along(t1, w);
  return `<polygon points="${pts([[a - w / 2, ay], [a + w / 2, ay], [b + w / 2, by], [b - w / 2, by]])}" fill="#C"/>`;
}

const ARMS = [
  ["Plin", w => slice(0, 1, w)],
  ["Rotunjit", w => { const [a, ay] = along(0, w); return `<path d="M${f(a)} ${f(ay + w / 2)} L${MID} ${B - w / 2}" stroke="#C" stroke-width="${w}" stroke-linecap="round" fill="none"/>`; }],
  ["Ascuțit sus", w => { const [a, ay] = along(0, w); return `<polygon points="${pts([[a - w * .7, ay], [a + w * .7, ay], [MID + w / 2, B], [MID - w / 2, B]])}" fill="#C"/>`; }],
  ["Subțire jos", w => { const [a, ay] = along(0, w); return `<polygon points="${pts([[a - w / 2, ay], [a + w / 2, ay], [MID + w * .18, B], [MID - w * .18, B]])}" fill="#C"/>`; }],
  ["2 bare", w => slice(0, .42, w) + slice(.56, 1, w)],
  ["3 bare", w => slice(0, .26, w) + slice(.37, .63, w) + slice(.74, 1, w)],
  ["Bare în trepte", w => slice(0, .3, w * .7) + slice(.38, .66, w * .85) + slice(.74, 1, w)],
  ["Contur", w => slice(0, 1, w).replace('fill="#C"', 'fill="none" stroke="#C" stroke-width="9" stroke-linejoin="round"')],
  ["Dublu", w => { const [a, ay] = along(0, w); const o = w * .32; return [-o, o].map(d => `<line x1="${f(a + d)}" y1="${ay}" x2="${f(MID + d)}" y2="${B}" stroke="#C" stroke-width="${f(w * .26)}" stroke-linecap="round"/>`).join(""); }],
  ["Puncte", w => [0, .25, .5, .75, 1].map(t => { const [x, y] = along(t, w); return `<circle cx="${f(x)}" cy="${f(Math.min(y, B - w * .4))}" r="${f(w * .42)}" fill="#C"/>`; }).join("")],
  ["Curbă", w => { const [a, ay] = along(0, w); return `<path d="M${f(a)} ${f(ay + w / 2)} Q${f(a + 4)} ${f(B - 30)} ${MID} ${B - w / 2}" stroke="#C" stroke-width="${w}" stroke-linecap="round" fill="none"/>`; }],
  ["Pensulă", w => { const [a, ay] = along(0, w); return `<path d="M${f(a - w * .55)} ${ay} Q${f(a + w * .9)} ${ay - 6} ${f(a + w * .6)} ${ay + 4} L${MID + w * .2} ${B} Q${MID - w * .3} ${B + 4} ${f(MID - w * .5)} ${B - 6} Z" fill="#C"/>`; }],
  ["Italic", w => { const [a, ay] = along(0, w); return `<polygon points="${pts([[a - w * .2, ay], [a + w * .8, ay], [MID + w * .5, B], [MID - w * .5, B]])}" fill="#C"/>`; }],
  ["Daltă", w => { const [a, ay] = along(0, w); return `<polygon points="${pts([[a - w / 2, ay + w * .5], [a + w / 2, ay], [MID + w / 2, B], [MID - w / 2, B]])}" fill="#C"/>`; }],
  ["Stencil", w => slice(0, .47, w) + slice(.53, 1, w)],
  ["Degrade", w => [0, 1, 2, 3, 4].map(i => `<g opacity="${f(.25 + i * .19)}">${slice(i * .2, i * .2 + .2, w)}</g>`).join("")],
  ["Pixeli", w => [0, .2, .4, .6, .8].map(t => { const [x, y] = along(t + .1, w); return `<rect x="${f(x - w * .45)}" y="${f(y - w * .45)}" width="${f(w * .9)}" height="${f(w * .9)}" rx="3" fill="#C"/>`; }).join("")],
  ["Zigzag", w => { const p = []; for (let i = 0; i <= 8; i++) { const [x, y] = along(i / 8, w); p.push([x + (i % 2 ? w * .35 : -w * .35), y]); } return `<polyline points="${pts(p)}" fill="none" stroke="#C" stroke-width="${f(w * .42)}" stroke-linejoin="round" stroke-linecap="round"/>`; }],
  ["Val", w => { const [a, ay] = along(0, w); return `<path d="M${f(a)} ${f(ay + w / 2)} C${f(a + 40)} ${f(ay + 40)} ${f(a - 20)} ${f(B - 60)} ${MID} ${B - w / 2}" stroke="#C" stroke-width="${f(w * .8)}" stroke-linecap="round" fill="none"/>`; }],
  ["Triunghiuri", w => [0, .34, .68].map(t => { const [x, y] = along(t, w), [x2, y2] = along(t + .3, w); return `<polygon points="${pts([[x - w / 2, y], [x + w / 2, y], [x2, y2]])}" fill="#C"/>`; }).join("")],
  ["Linie fină", w => { const [a, ay] = along(0, w); return `<line x1="${f(a)}" y1="${ay}" x2="${MID}" y2="${B - 4}" stroke="#C" stroke-width="${f(w * .3)}" stroke-linecap="round"/>`; }],
  ["Gol", () => ""],
];

const PARTS = {
  container: { label: "Container", color: "box", items: [
    ["Fără", () => ""],
    ["Squircle", () => `<rect x="6" y="6" width="244" height="244" rx="64" fill="#C"/>`],
    ["Pătrat", () => `<rect x="6" y="6" width="244" height="244" rx="22" fill="#C"/>`],
    ["Cerc", () => `<circle cx="128" cy="128" r="122" fill="#C"/>`],
    ["Hexagon", () => `<polygon points="${pts([...Array(6)].map((_, i) => { const a = Math.PI / 3 * i - Math.PI / 2; return [128 + 122 * Math.cos(a), 128 + 122 * Math.sin(a)]; }))}" fill="#C" stroke="#C" stroke-width="14" stroke-linejoin="round"/>`],
    ["Scut", () => `<path d="M128 6 L238 40 L232 140 Q220 214 128 250 Q36 214 24 140 L18 40 Z" fill="#C"/>`],
    ["Romb", () => `<rect x="38" y="38" width="180" height="180" rx="34" transform="rotate(45 128 128)" fill="#C"/>`],
    ["Inel", () => `<circle cx="128" cy="128" r="114" fill="none" stroke="#C" stroke-width="14"/>`],
    ["Contur rotunjit", () => `<rect x="10" y="10" width="236" height="236" rx="60" fill="none" stroke="#C" stroke-width="12"/>`],
    ["Octogon", () => `<polygon points="${pts([...Array(8)].map((_, i) => { const a = Math.PI / 4 * i + Math.PI / 8; return [128 + 124 * Math.cos(a), 128 + 124 * Math.sin(a)]; }))}" fill="#C" stroke="#C" stroke-width="10" stroke-linejoin="round"/>`],
    ["Blob", () => `<path d="M128 8 C196 6 250 50 248 124 C246 196 200 250 126 248 C54 246 6 200 8 128 C10 58 62 10 128 8Z" fill="#C"/>`],
    ["Squircle înclinat", () => `<rect x="22" y="22" width="212" height="212" rx="60" transform="rotate(-8 128 128)" fill="#C"/>`],
    ["Sticlă", () => `<rect x="6" y="6" width="244" height="244" rx="64" fill="#C"/><path d="M6 110 V70 Q6 6 70 6 H186 Q240 6 248 52 Q140 70 6 110Z" fill="#fff" opacity=".07"/><rect x="7" y="7" width="242" height="242" rx="63" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>`],
    ["Badge dublu", () => `<rect x="6" y="6" width="244" height="244" rx="64" fill="#C"/><rect x="20" y="20" width="216" height="216" rx="52" fill="none" stroke="#ACC" stroke-opacity=".45" stroke-width="4"/>`],
    ["Picătură", () => `<path d="M128 6 C190 70 240 120 240 160 A112 92 0 0 1 16 160 C16 120 66 70 128 6Z" fill="#C"/>`],
  ]},
  back: { label: "Straturi spate", color: "accent", items: [
    ["Fără", () => ""],
    ["Ecou", w => `<g opacity=".35" transform="translate(0 -${f(w * 1.1)})">${slice(0, 1, w * .8)}${mirror(slice(0, 1, w * .8))}</g>`],
    ["2 ecouri", w => [2, 1].map(k => `<g opacity="${.18 * (3 - k)}" transform="translate(0 -${f(w * 1.05 * k)})">${slice(0, 1, w * .75)}${mirror(slice(0, 1, w * .75))}</g>`).join("")],
    ["Umbră", w => `<g opacity=".4" transform="translate(${f(w * .35)} ${f(w * .35)})">${slice(0, 1, w)}${mirror(slice(0, 1, w))}</g>`],
    ["Chevron", w => `<polyline points="${pts([[L + 10, T - 22], [MID, B - 70], [R - 10, T - 22]])}" fill="none" stroke="#C" stroke-width="${f(w * .45)}" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>`],
    ["Halo", () => `<circle cx="128" cy="124" r="92" fill="#C" opacity=".16"/><circle cx="128" cy="124" r="62" fill="#C" opacity=".16"/>`],
    ["Orbită", () => `<ellipse cx="128" cy="128" rx="112" ry="40" transform="rotate(-24 128 128)" fill="none" stroke="#C" stroke-width="6" opacity=".7"/>`],
    ["Puncte grilă", () => [...Array(36)].map((_, i) => `<circle cx="${38 + (i % 6) * 36}" cy="${38 + Math.floor(i / 6) * 36}" r="3" fill="#C" opacity=".35"/>`).join("")],
    ["Dungi", () => [...Array(7)].map((_, i) => `<line x1="${-20 + i * 46}" y1="250" x2="${80 + i * 46}" y2="6" stroke="#C" stroke-width="10" opacity=".12"/>`).join("")],
    ["Rază sus", () => `<polygon points="128,124 60,0 196,0" fill="#C" opacity=".14"/>`],
  ]},
  left: { label: "Braț stâng", color: "left", items: ARMS },
  right: { label: "Braț drept", color: "right", items: ARMS, mirrored: true },
  notch: { label: "Vârf", color: "left", items: [
    ["Plat", () => ""],
    ["Rotund", w => `<circle cx="${MID}" cy="${B - w * .5}" r="${f(w * .62)}" fill="#C"/>`],
    ["Ascuțit", w => `<polygon points="${pts([[MID - w * .62, B - 2], [MID + w * .62, B - 2], [MID, B + w * .9]])}" fill="#C"/>`],
    ["Nicovală", w => `<path d="M${MID - 64} ${B + 6} H${MID + 64} L${MID + 46} ${B + 22} H${MID + 30} L${MID + 34} ${B + 40} H${MID - 34} L${MID - 30} ${B + 22} H${MID - 46} Z" fill="#C"/>`],
    ["Bază", () => `<rect x="${MID - 52}" y="${B + 10}" width="104" height="14" rx="7" fill="#C"/>`],
    ["Punct jos", w => `<circle cx="${MID}" cy="${B + 22}" r="${f(w * .32)}" fill="#C"/>`],
    ["Gem", w => `<polygon points="${pts([[MID, B + w * .2], [MID + w * .7, B + w * .8], [MID, B + w * 1.6], [MID - w * .7, B + w * .8]])}" fill="#C"/>`],
    ["Bare duble", () => `<rect x="${MID - 52}" y="${B + 8}" width="104" height="10" rx="5" fill="#C"/><rect x="${MID - 34}" y="${B + 24}" width="68" height="10" rx="5" fill="#C"/>`],
    ["Picior", w => `<rect x="${f(MID - w * .32)}" y="${B - 4}" width="${f(w * .64)}" height="34" rx="4" fill="#C"/><rect x="${MID - 40}" y="${B + 28}" width="80" height="10" rx="5" fill="#C"/>`],
  ]},
  caps: { label: "Capete sus", color: "accent", items: [
    ["Fără", () => ""],
    ["Noduri", w => [L + w / 2, R - w / 2].map(x => `<circle cx="${f(x)}" cy="${T}" r="${f(w * .62)}" fill="#C"/>`).join("")],
    ["Inele", w => [L + w / 2, R - w / 2].map(x => `<circle cx="${f(x)}" cy="${T}" r="${f(w * .58)}" fill="none" stroke="#C" stroke-width="7"/>`).join("")],
    ["Bară peste", w => `<polygon points="${pts([[L + w * .1, T - w * .95], [R + w * .1, T - w * .95], [R - w * .3, T - w * .2], [L - w * .3, T - w * .2]])}" fill="#C"/>`],
    ["Steag dreapta", w => `<polygon points="${pts([[R - w * .2, T - w * .3], [R + w * 1.2 - 34, T - w * .3], [R + w * .6 - 34, T + w * .55], [R - w * .8, T + w * .55]])}" fill="#C"/>`],
    ["Coroană", w => `<path d="M${MID - 50} ${T - 10} L${MID - 30} ${T - 40} L${MID} ${T - 18} L${MID + 30} ${T - 40} L${MID + 50} ${T - 10} Z" fill="#C"/>`],

  const filled = ![0, 7, 8].includes(s.container);
  const adapt = c => light && s.autoLight && !filled && nearWhite(c) ? "#1b1c24" : c;
  let defs = "";
  const paint = (part, c) => {
    c = adapt(c);
    if (s.gradient && part !== "container" && lum(c) < 200 && lum(c) > 40 && c !== adapt(s.leftc)) {
      defs += `<linearGradient id="${u}${part}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${shade(c, -.3)}"/></linearGradient>`;
      return `url(#${u}${part})`;
    }
    return c;
  };
  const fade = (key, g) => dim && key !== dim && key !== "container" && g ? `<g opacity=".18">${g}</g>` : g;
  const layers = [
    ...ORDER.map((part, i) => {
      let g = PARTS[part].items[s[part]][1](w).replaceAll("#C", paint(part, colorFor(part, s))).replaceAll("#BOX", s.box).replaceAll("#ACC", s.accent);
      if (PARTS[part].mirrored) g = mirror(g);
      return [layerOf(s, part, i), part, fade(part, place(s, part, g))];
    }),
    ...ACCENTS.map((k, i) => [layerOf(s, k, 10 + i), k, fade(k, place(s, k, accentLayer(s, k, paint)))]),
  ].sort((a, b) => a[0] - b[0]);
  const container = layers.filter(l => l[1] === "container").map(l => l[2]).join("");
  let body = container + place(s, "all", layers.filter(l => l[1] !== "container").map(l => l[2]).join(""));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="${size}" height="${size}">${defs ? `<defs>${defs}</defs>` : ""}${body}</svg>`;
}
/** Per-element move/rotate/scale around the icon centre; `all` moves the whole mark. */
function place(s, key, g) {
  if (!g) return g;
  const x = s[key + "X"] ?? 0, y = s[key + "Y"] ?? 0, r = s[key + "R"] ?? 0, z = (s[key + "Z"] ?? 100) / 100, fx = s[key + "F"] ? -1 : 1;
  if (!x && !y && !r && z === 1 && fx === 1) return g;
  return `<g transform="translate(${f(128 + x)} ${f(128 + y)}) rotate(${r}) scale(${f(z * fx * 1000) / 1000} ${f(z * 1000) / 1000}) translate(-128 -128)">${g}</g>`;
}
function layerOf(s, key, fallback) { return s[key + "L"] ?? fallback; }
function lum(hex) { if (!/^#[0-9a-f]{6}$/i.test(hex)) return 0; const n = parseInt(hex.slice(1), 16); return (n >> 16) * .3 + (n >> 8 & 255) * .59 + (n & 255) * .11; }
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); return "#" + [n >> 16, n >> 8 & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v + (a < 0 ? v : 255 - v) * a))).toString(16).padStart(2, "0")).join(""); }

// ── Rendering ──────────────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function set(patch) { hist.push({ ...S }); if (hist.length > 100) hist.shift(); Object.assign(S, patch); draw(); }

function draw(keepCustom) {
  $("cur").innerHTML = svg(S, 200, null, lightBg);
  $("cur").style.background = lightBg ? "#f2f2f6" : "";
  $("logo-dark").innerHTML = lockup(S, 120);
  $("logo-light").innerHTML = lockup(onLight(S), 120);
  $("sizes").innerHTML = [16, 24, 32, 48, 64, 96].map(n => `<figure>${svg(S, n)}<figcaption>${n}</figcaption></figure>`).join("");
  $("stage-dark").innerHTML = `<span class="tag">Întunecat</span>` + svg(S, 256);
  $("stage-light").innerHTML = `<span class="tag">Deschis</span>` + svg(S, 256, null, true);
  $("brand-dot").innerHTML = svg(S, 22);
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const label = k => k === "__colors" ? "Culori" : ACCENTS.includes(k) ? `Accent ${ACCENTS.indexOf(k) + 1}` : k === "all" ? "Tot logo-ul" : cap(LOGO_TAB[k]?.[1].replace("Logo: ", "") ?? PARTS[k].label);
  const badge = k => ACCENTS.includes(k) ? (S[k] ? SHAPES[S[k]][0] : "gol") : k in PARTS && k !== "weight" ? PARTS[k].items[S[k]][0] : k in LOGO_TAB ? LOGO_TAB[k][2][S[k]] : "";
  const groups = [["Iconă", [...ORDER, "weight"]], ["Accente", ACCENTS], ["Compoziție", ["all", "__colors"]], ["Logo", LOGO_TABS.map(t => t[0])]];
  $("tabs").innerHTML = groups.map(([g, keys]) => `<div class="group">${g}</div>` + keys.map(k => `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${label(k)}<em>${esc(String(badge(k) ?? ""))}</em></button>`).join("")).join("");
  $("insp-title").textContent = label(tab);
  $("saved").innerHTML = saved.map((s, i) => `<div class="slot" data-i="${i}" title="${s ? "Încarcă" : "Salvează aici"}">${s ? svg(s, 56) + `<button class="x" data-del="${i}">✕</button>` : "<span>★</span>"}</div>`).join("");
  $("focus").classList.toggle("on", focus);
  $("bgmode").textContent = lightBg ? "Fundal: deschis" : "Fundal: întunecat";
  $("compare").innerHTML = [["Curent", S], ...saved.map((s, i) => s && [`#${i + 1}`, s]).filter(Boolean)].map(([n, s]) =>
    `<div class="cmp"><div class="pair"><div class="dark">${svg(s, 92)}</div><div class="light">${svg(s, 92, null, true)}</div></div><div class="lk dark" style="min-height:0;padding:8px">${lockup(s, 46)}</div>${n}</div>`).join("");
  drawGrid(keepCustom);
  history.replaceState(null, "", "#" + new URLSearchParams(Object.entries(S).filter(([, v]) => v !== undefined).map(([k, v]) => [k, String(v)])));
  store();
}

function drawGrid(keepCustom) {
  if (!keepCustom) $("custom").innerHTML = "";
  if (tab === "all") {
    $("grid").classList.remove("wide");
    $("hint").textContent = "Tot logo-ul: mută, rotește, scalează sau oglindește toate elementele odată, în interiorul containerului.";
    if (!keepCustom) $("custom").innerHTML = transformControls("all");
    $("grid").innerHTML = "";
    return;
  }
  if (ACCENTS.includes(tab)) {
    const k = tab, n = ACCENTS.indexOf(k) + 1;
    $("grid").classList.remove("wide");
    $("hint").textContent = `Accent ${n}: alege forma; dedesubt poziția, culoarea, mărimea, rotația, deplasarea și opacitatea. Poți combina până la 4 accente.`;
    if (!keepCustom) $("custom").innerHTML =
      `<label>Poziție <select data-acc="${k}p">${POSITIONS.map((p, i) => `<option value="${i}" ${S[k + "p"] === i ? "selected" : ""}>${p[0]}</option>`).join("")}</select></label>` +
      ` <label>Culoare <select data-acc="${k}c" data-str="1">${ACOLORS.map(([v, l]) => `<option value="${v}" ${S[k + "c"] === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>` +
      ` <label>Mărime <input type="range" min="4" max="70" data-acc="${k}z" value="${S[k + "z"]}"></label>` +
      ` <label>Rotație <input type="range" min="-180" max="180" step="5" data-acc="${k}r" value="${S[k + "r"]}"></label>` +
      ` <label>X <input type="range" min="-70" max="70" data-acc="${k}x" value="${S[k + "x"]}"></label>` +
      ` <label>Y <input type="range" min="-70" max="70" data-acc="${k}y" value="${S[k + "y"]}"></label>` +
      ` <label>Opacitate <input type="range" min=".15" max="1" step=".05" data-acc="${k}o" value="${S[k + "o"]}"></label><br>` + transformControls(k, 10 + ACCENTS.indexOf(k));
    $("grid").innerHTML = SHAPES.map((sh, i) =>
      `<div class="opt ${S[k] === i ? "on" : ""}" data-pick="${i}">${svg({ ...S, [k]: i }, 120, focus ? k : null)}<small>${sh[0]}</small></div>`).join("");
    return;
  }
  if (keepCustom) return;
  $("grid").classList.toggle("wide", tab in LOGO_TAB);
  if (tab in LOGO_TAB) {
    const [, label, list] = LOGO_TAB[tab];
    $("hint").textContent = `${label}: alege; iconița rămâne cea compusă de tine.`;
    $("custom").innerHTML = `<b>Text</b><label>Nume <input type="text" data-text="word" value="${esc(S.word)}"></label><label>Slogan <input type="text" data-text="tag" value="${esc(S.tag)}"></label>` +
      `<b>Cuvântul 1</b><label>Culoare <input type="color" data-text="wordc" value="${S.wordc}"></label><label>Grosime <select data-acc="w1w">${WEIGHTS.map(([n, v]) => `<option value="${v}" ${S.w1w === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>` +
      `<label>Prima literă altă culoare <input type="checkbox" data-flip="fl" ${S.fl ? "checked" : ""}></label><label>Culoare primă literă <input type="color" data-text="flc" value="${S.flc}"></label>` +
      `<b>Cuvântul 2 și următoarele</b><label>Culoare <input type="color" data-text="wc2" value="${S.wc2}"></label><label>Grosime <select data-acc="w2w">${WEIGHTS.map(([n, v]) => `<option value="${v}" ${S.w2w === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>` +
      `<b>Slogan</b><label>Culoare <input type="color" data-text="tagc" value="${S.tagc}"></label>` +
      ` <label>Opacitate slogan <input type="range" min=".2" max="1" step=".05" data-acc="tago" value="${S.tago}"></label><br>` +
      `<b>Mărimi și poziții</b> <label>Text <input type="range" min="50" max="160" data-acc="wsz" value="${S.wsz}"></label> <label>Spațiere litere <input type="range" min="-6" max="20" data-acc="wls" value="${S.wls}"></label>` +
      ` <label>Slogan <input type="range" min="50" max="180" data-acc="tsz" value="${S.tsz}"></label> <label>Text sus/jos <input type="range" min="-40" max="40" data-acc="wdy" value="${S.wdy}"></label>` +
      ` <label>Slogan sus/jos <input type="range" min="-30" max="40" data-acc="tdy" value="${S.tdy}"></label> <label>Distanță iconă–text <input type="range" min="-40" max="120" data-acc="gap" value="${S.gap}"></label>`;
    $("grid").innerHTML = list.map((name, i) =>
      `<div class="opt ${S[tab] === i ? "on" : ""}" data-pick="${i}"><div class="lkc">${lockup({ ...S, [tab]: i }, 90)}</div><small>${name}</small></div>`).join("");
    return;
  }
  if (tab === "__colors") {
    $("hint").textContent = "Click pe o culoare o aplică elementului; selectorul din dreapta acceptă orice culoare. Gradient = accent și braț drept cu degrade.";
    $("custom").innerHTML = COLOR_TABS.map(([k, n]) => `<label>${n} <input type="color" data-color="${k}" value="${cval(k)}"></label>`).join(" · ") +
      ` · <label><input type="checkbox" id="grad" ${S.gradient ? "checked" : ""}> Gradient</label>` +
      ` · <label><input type="checkbox" id="autolight" ${S.autoLight ? "checked" : ""}> Pe fundal alb, albul devine închis (fără container)</label>`;
    $("grid").innerHTML = COLOR_TABS.flatMap(([k, n]) => PALETTES[k].map(c =>
      `<div class="opt ${cval(k) === c ? "on" : ""}" data-set-color="${k}" data-value="${c}"><div class="swatch" style="background:${k === "box" ? "transparent" : "#0b0c10"}">${svg({ ...S, ...colorPatch(k, c) }, 96)}</div><small>${n}<br>${c}</small></div>`)).join("");
    return;
  }
  if (tab !== "weight") $("custom").innerHTML = transformControls(tab, ORDER.indexOf(tab));
  const part = PARTS[tab];
  $("hint").textContent = tab === "weight" ? "Grosimea tuturor elementelor." : `${part.label}: ${part.items.length} variante. Restul logo-ului rămâne cum l-ai ales${focus ? " (estompat ca să vezi elementul)" : ""}.`;
  $("grid").innerHTML = part.items.map((item, i) =>
    `<div class="opt ${S[tab] === i ? "on" : ""}" data-pick="${i}">${svg({ ...S, [tab]: i }, 120, focus && tab !== "weight" ? tab : null)}<small>${item[0]}</small></div>`).join("");
}
const cval = k => ({ box: S.box, left: S.leftc, right: S.rightc, accent: S.accent, accent2: S.accent2 })[k];
/** Sliders that move one element anywhere: position, full rotation, scale, mirror and layer. */
function transformControls(key, layer) {
  const v = (k, d) => S[key + k] ?? d;
  return `<b>Poziționare</b>` +
    ` <label>X <input type="range" min="-128" max="128" data-acc="${key}X" value="${v("X", 0)}"></label>` +
    ` <label>Y <input type="range" min="-128" max="128" data-acc="${key}Y" value="${v("Y", 0)}"></label>` +
    ` <label>Rotație <input type="range" min="-180" max="180" data-acc="${key}R" value="${v("R", 0)}"></label>` +
    ` <label>Mărime <input type="range" min="20" max="200" data-acc="${key}Z" value="${v("Z", 100)}"></label>` +
    (key === "all" ? "" : ` <label>Strat <input type="range" min="0" max="20" data-acc="${key}L" value="${v("L", layer)}" title="mai mare = deasupra"></label>`) +
    ` <label><input type="checkbox" data-flip="${key}F" ${S[key + "F"] ? "checked" : ""}> Oglindit</label>` +
    ` <button data-reset-t="${key}">Reset poziție</button>`;
}
const LOGO_TABS = [["layout", "Logo: aranjare", LAYOUTS], ["font", "Logo: font", FONTS.map(x => x[0])], ["tstyle", "Logo: majuscule", TSTYLES]];
const LOGO_TAB = Object.fromEntries(LOGO_TABS.map(t => [t[0], t]));
/** Light-background variant: light text turns dark so the wordmark stays readable. */
function greyish(c) { if (!/^#[0-9a-f]{6}$/i.test(c)) return false; const n = parseInt(c.slice(1), 16), ch = [n >> 16, n >> 8 & 255, n & 255]; return Math.max(...ch) - Math.min(...ch) < 48; }
function nearWhite(c) { if (!/^#[0-9a-f]{6}$/i.test(c)) return false; const n = parseInt(c.slice(1), 16), ch = [n >> 16, n >> 8 & 255, n & 255]; return lum(c) > 170 && Math.max(...ch) - Math.min(...ch) < 48; }
function onLight(s) { const dark = c => nearWhite(c) ? "#16171d" : c; return { ...s, _light: true, wordc: dark(s.wordc), wc2: dark(s.wc2), flc: dark(s.flc), tagc: lum(s.tagc) > 130 && greyish(s.tagc) ? "#5d5f6e" : s.tagc }; }
const colorPatch = (k, c) => ({ box: { box: c }, left: { leftc: c }, right: { rightc: c }, accent: { accent: c }, accent2: { accent2: c } })[k];

// ── Events ─────────────────────────────────────────────────────────────────────────────────
$("tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; draw(); } };
$("grid").onclick = e => {
  const pick = e.target.closest("[data-pick]"); if (pick) return set({ [tab]: Number(pick.dataset.pick) });
  const col = e.target.closest("[data-set-color]"); if (col) set(colorPatch(col.dataset.setColor, col.dataset.value));
};
$("custom").oninput = e => {
  if (e.target.dataset.color) set(colorPatch(e.target.dataset.color, e.target.value));
  if (e.target.id === "grad") set({ gradient: e.target.checked });
  if (e.target.id === "autolight") set({ autoLight: e.target.checked });
  if (e.target.dataset.text) { Object.assign(S, { [e.target.dataset.text]: e.target.value }); $("logo-dark").innerHTML = lockup(S, 120); $("logo-light").innerHTML = lockup(onLight(S), 120); store(); }
};
$("custom").addEventListener("input", e => {
  const key = e.target.dataset.acc; if (!key) return;
  if (!e.target._started) { hist.push({ ...S }); e.target._started = true; }
  S[key] = e.target.dataset.str ? e.target.value : Number(e.target.value);
  draw(true);
});
$("custom").addEventListener("click", e => {
  const key = e.target.dataset.resetT; if (!key) return;
  set(Object.fromEntries(["X", "Y", "R", "Z", "L", "F"].map(k => [key + k, undefined])));
  drawGrid();
});
$("custom").addEventListener("change", e => {
  if (e.target.dataset.flip) { set({ [e.target.dataset.flip]: e.target.checked }); return; } if (e.target.dataset.acc) e.target._started = false; });
$("custom").onchange = e => { if (e.target.dataset.text) set({}); };
$("saved").onclick = e => {
  const del = e.target.closest("[data-del]"); if (del) { saved[del.dataset.del] = null; return draw(); }
  const slot = e.target.closest("[data-i]"); if (!slot) return;
  const i = slot.dataset.i; if (saved[i]) set({ ...saved[i] }); else { saved[i] = { ...S }; draw(); }
};
$("undo").onclick = () => { if (hist.length) { S = hist.pop(); draw(); } };
document.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("undo").click(); } };
$("reset").onclick = () => set({ ...BASE });
const rnd = n => Math.floor(Math.random() * n);
$("random").onclick = () => set({
  ...Object.fromEntries([...ORDER, "weight"].map(k => [k, rnd(PARTS[k].items.length)])),
  ...Object.fromEntries(ACCENTS.flatMap((k, i) => [[k, i < 2 || Math.random() < .4 ? rnd(SHAPES.length) : 0], [k + "p", rnd(POSITIONS.length)], [k + "z", 8 + rnd(28)], [k + "r", [0, 0, 15, -15, 45][rnd(5)]], [k + "x", 0], [k + "y", 0], [k + "c", ["accent", "accent2"][rnd(2)]]])),
});
$("focus").onclick = () => { focus = !focus; draw(); };
$("bgmode").onclick = () => { lightBg = !lightBg; draw(); };
const download = (name, blob) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$("svg").onclick = () => download("v-icon.svg", new Blob([svg(S)], { type: "image/svg+xml" }));
$("copy").onclick = () => navigator.clipboard.writeText(svg(S));
$("link").onclick = () => navigator.clipboard.writeText(location.href);
$("png").onclick = () => toPng(svg(S, 1024), 1024, 1024, "v-icon.png");
$("lsvg").onclick = () => download("v-logo.svg", new Blob([lockup(S, 180)], { type: "image/svg+xml" }));
$("lpng").onclick = () => { const l = lockup(S, 360); const w = Number(l.match(/width="([\d.]+)"/)[1]); toPng(l, Math.round(w), 360, "v-logo.png"); };
function toPng(markup, w, h, name) { const img = new Image(); img.onload = () => { const c = Object.assign(document.createElement("canvas"), { width: w, height: h }); c.getContext("2d").drawImage(img, 0, 0, w, h); c.toBlob(b => download(name, b)); }; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup); }
draw();
</script>
</body>
</html>
