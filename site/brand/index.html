<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V — icon studio</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0e0f14;--panel:#16171e;--panel2:#1d1e27;--line:#2a2c38;--text:#ecedf3;--muted:#9a9cad;--hl:#eb6f92;color-scheme:dark}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:auto auto 1fr;gap:22px;align-items:start;padding:16px 22px;background:#0a0b0f;border-bottom:1px solid var(--line)}
.big{display:grid;gap:6px;justify-items:center}
.big h4{margin:0;font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.big .stage{width:220px;height:220px;border-radius:18px;display:grid;place-items:center;border:1px solid var(--line);background:repeating-conic-gradient(#14151b 0 25%,#101116 0 50%) 0 0/20px 20px}
.big .stage svg{width:200px;height:200px}
.bar{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;transition:border-color .12s,background .12s,transform .12s}
button:hover{border-color:#40435a}
button:active{transform:translateY(1px)}
button.on{border-color:var(--hl);background:#2a1d25}
.side{display:grid;gap:10px;align-content:start}
.sizes{display:flex;gap:14px;align-items:end;padding:8px 0}
.sizes figure{margin:0;text-align:center;font-size:10px;color:var(--muted)}
.saved{display:grid;grid-template-columns:repeat(5,64px);gap:8px}
.slot{position:relative;width:64px;height:64px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;cursor:pointer;background:var(--panel)}
.slot svg{width:56px;height:56px}
.slot .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;padding:0;font-size:10px;line-height:16px;border-radius:50%;display:none}
.slot:hover .x{display:block}
.slot span{color:var(--muted);font-size:11px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 22px 0}
nav button{border-radius:999px;padding:6px 14px}
.hint{color:var(--muted);font-size:12px;padding:6px 22px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px 22px 30px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;justify-items:center;cursor:pointer;transition:border-color .12s,transform .12s}
.opt:hover{transform:translateY(-2px);border-color:#40435a}
.opt.on{border-color:var(--hl);box-shadow:0 0 0 1px var(--hl) inset}
.opt svg{width:120px;height:120px}
.opt small{color:var(--muted);font-size:11px;text-align:center}
.swatch{width:100%;height:120px;border-radius:10px;display:grid;place-items:center}
.swatch svg{width:96px;height:96px}
.compare{padding:0 22px 30px}
.compare h3{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:14px;flex-wrap:wrap}
.cmp{display:grid;gap:6px;justify-items:center;font-size:11px;color:var(--muted)}
.cmp .pair{display:flex;gap:6px}
.cmp .pair div{width:110px;height:110px;border-radius:14px;display:grid;place-items:center}
.cmp svg{width:92px;height:92px}
.dark{background:#0b0c10;border:1px solid var(--line)}
.light{background:#f2f2f6}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer}
.custom{display:flex;gap:8px;align-items:center;padding:0 22px;color:var(--muted);font-size:12px}
@media (max-width:900px){header{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="big"><h4>Curent</h4><div class="stage" id="cur"></div></div>
  <div class="side">
    <div class="bar">
      <button id="undo" title="Ctrl+Z">↶ Înapoi</button>
      <button id="random">🎲 Aleator</button>
      <button id="reset">Reset</button>
      <button id="svg">⬇ Iconă SVG</button>
      <button id="png">⬇ Iconă PNG</button>
      <button id="lsvg">⬇ Logo SVG</button>
      <button id="lpng">⬇ Logo PNG</button>
      <button id="copy">Copiază SVG</button>
      <button id="link">Copiază link</button>
    </div>
    <div class="sizes" id="sizes"></div>
    <div class="bar"><button id="focus" class="on" title="Estompează celelalte elemente în galerie">Focus pe element</button><button id="bgmode">Fundal: întunecat</button></div>
  </div>
  <div class="side">
    <h4 style="margin:0;font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em">Salvate (click = încarcă, ★ = salvează curentul)</h4>
    <div class="saved" id="saved"></div>
  </div>
</header>
<section class="logo-stage">
  <div class="lk dark" id="logo-dark"></div>
  <div class="lk light" id="logo-light"></div>
</section>

<nav id="tabs"></nav>
<div class="hint" id="hint"></div>
<div class="custom" id="custom"></div>
<div class="grid" id="grid"></div>

<section class="compare">
  <h3>Comparație: curent · salvate — pe întunecat și deschis</h3>
  <div class="row" id="compare"></div>
</section>
<style>
.logo-stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 22px 0}
.lk{border-radius:16px;display:grid;place-items:center;min-height:150px;padding:16px;overflow:hidden}
.lk svg{max-width:100%;height:auto;max-height:120px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.opt .lkc{width:100%;display:grid;place-items:center;min-height:110px;background:#0b0c10;border-radius:10px;padding:8px}
.opt .lkc svg{max-width:100%;height:auto;max-height:90px}
.custom input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:220px}
@media (max-width:900px){.logo-stage{grid-template-columns:1fr}}
</style>

<script>
// Every part shares one 256×256 coordinate system, so any variant of any part composes with any
// other: the mark is just the parts drawn in ORDER. Arms are drawn for the left side; the right
// arm reuses the same shapes mirrored, so left and right can differ.
const T = 52, B = 204, L = 46, R = 210, MID = 128;          // V frame: top, bottom (notch), left, right
const f = n => Math.round(n * 10) / 10;
const pts = a => a.map(p => `${f(p[0])},${f(p[1])}`).join(" ");

/** Point on the left arm's centre line at t (0 = top, 1 = notch). */
function along(t, w) { const x0 = L + w / 2, x1 = MID; return [x0 + (x1 - x0) * t, T + (B - T) * t]; }
/** Parallelogram slice of the left arm between t0 and t1, cut horizontally like the veskforge F. */
function slice(t0, t1, w) {
  const [a, ay] = along(t0, w), [b, by] = along(t1, w);
  return `<polygon points="${pts([[a - w / 2, ay], [a + w / 2, ay], [b + w / 2, by], [b - w / 2, by]])}" fill="#C"/>`;
}

const ARMS = [
  ["Plin", w => slice(0, 1, w)],
  ["Rotunjit", w => { const [a, ay] = along(0, w); return `<path d="M${f(a)} ${f(ay + w / 2)} L${MID} ${B - w / 2}" stroke="#C" stroke-width="${w}" stroke-linecap="round" fill="none"/>`; }],
  ["Ascuțit sus", w => { const [a, ay] = along(0, w); return `<polygon points="${pts([[a - w * .7, ay], [a + w * .7, ay], [MID + w / 2, B], [MID - w / 2, B]])}" fill="#C"/>`; }],
  ["Subțire jos", w => { const [a, ay] = along(0, w); return `<polygon points="${pts([[a - w / 2, ay], [a + w / 2, ay], [MID + w * .18, B], [MID - w * .18, B]])}" fill="#C"/>`; }],
  ["2 bare", w => slice(0, .42, w) + slice(.56, 1, w)],
  ["3 bare", w => slice(0, .26, w) + slice(.37, .63, w) + slice(.74, 1, w)],
  ["Bare în trepte", w => slice(0, .3, w * .7) + slice(.38, .66, w * .85) + slice(.74, 1, w)],
  ["Contur", w => slice(0, 1, w).replace('fill="#C"', 'fill="none" stroke="#C" stroke-width="9" stroke-linejoin="round"')],
  ["Dublu", w => { const [a, ay] = along(0, w); const o = w * .32; return [-o, o].map(d => `<line x1="${f(a + d)}" y1="${ay}" x2="${f(MID + d)}" y2="${B}" stroke="#C" stroke-width="${f(w * .26)}" stroke-linecap="round"/>`).join(""); }],
  ["Puncte", w => [0, .25, .5, .75, 1].map(t => { const [x, y] = along(t, w); return `<circle cx="${f(x)}" cy="${f(Math.min(y, B - w * .4))}" r="${f(w * .42)}" fill="#C"/>`; }).join("")],
  ["Curbă", w => { const [a, ay] = along(0, w); return `<path d="M${f(a)} ${f(ay + w / 2)} Q${f(a + 4)} ${f(B - 30)} ${MID} ${B - w / 2}" stroke="#C" stroke-width="${w}" stroke-linecap="round" fill="none"/>`; }],
  ["Pensulă", w => { const [a, ay] = along(0, w); return `<path d="M${f(a - w * .55)} ${ay} Q${f(a + w * .9)} ${ay - 6} ${f(a + w * .6)} ${ay + 4} L${MID + w * .2} ${B} Q${MID - w * .3} ${B + 4} ${f(MID - w * .5)} ${B - 6} Z" fill="#C"/>`; }],
  ["Gol", () => ""],
];

const PARTS = {
  container: { label: "Container", color: "box", items: [
    ["Fără", () => ""],
    ["Squircle", () => `<rect x="6" y="6" width="244" height="244" rx="64" fill="#C"/>`],
    ["Pătrat", () => `<rect x="6" y="6" width="244" height="244" rx="22" fill="#C"/>`],
    ["Cerc", () => `<circle cx="128" cy="128" r="122" fill="#C"/>`],
    ["Hexagon", () => `<polygon points="${pts([...Array(6)].map((_, i) => { const a = Math.PI / 3 * i - Math.PI / 2; return [128 + 122 * Math.cos(a), 128 + 122 * Math.sin(a)]; }))}" fill="#C" stroke="#C" stroke-width="14" stroke-linejoin="round"/>`],
    ["Scut", () => `<path d="M128 6 L238 40 L232 140 Q220 214 128 250 Q36 214 24 140 L18 40 Z" fill="#C"/>`],
    ["Romb", () => `<rect x="38" y="38" width="180" height="180" rx="34" transform="rotate(45 128 128)" fill="#C"/>`],
    ["Inel", () => `<circle cx="128" cy="128" r="114" fill="none" stroke="#C" stroke-width="14"/>`],
    ["Contur rotunjit", () => `<rect x="10" y="10" width="236" height="236" rx="60" fill="none" stroke="#C" stroke-width="12"/>`],
  ]},
  back: { label: "Straturi spate", color: "accent", items: [
    ["Fără", () => ""],
    ["Ecou", w => `<g opacity=".35" transform="translate(0 -${f(w * 1.1)})">${slice(0, 1, w * .8)}${mirror(slice(0, 1, w * .8))}</g>`],
    ["2 ecouri", w => [2, 1].map(k => `<g opacity="${.18 * (3 - k)}" transform="translate(0 -${f(w * 1.05 * k)})">${slice(0, 1, w * .75)}${mirror(slice(0, 1, w * .75))}</g>`).join("")],
    ["Umbră", w => `<g opacity=".4" transform="translate(${f(w * .35)} ${f(w * .35)})">${slice(0, 1, w)}${mirror(slice(0, 1, w))}</g>`],
    ["Chevron", w => `<polyline points="${pts([[L + 10, T - 22], [MID, B - 70], [R - 10, T - 22]])}" fill="none" stroke="#C" stroke-width="${f(w * .45)}" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>`],
  ]},
  left: { label: "Braț stâng", color: "left", items: ARMS },
  right: { label: "Braț drept", color: "right", items: ARMS, mirrored: true },
  notch: { label: "Vârf", color: "left", items: [
    ["Plat", () => ""],
    ["Rotund", w => `<circle cx="${MID}" cy="${B - w * .5}" r="${f(w * .62)}" fill="#C"/>`],
    ["Ascuțit", w => `<polygon points="${pts([[MID - w * .62, B - 2], [MID + w * .62, B - 2], [MID, B + w * .9]])}" fill="#C"/>`],
    ["Nicovală", w => `<path d="M${MID - 64} ${B + 6} H${MID + 64} L${MID + 46} ${B + 22} H${MID + 30} L${MID + 34} ${B + 40} H${MID - 34} L${MID - 30} ${B + 22} H${MID - 46} Z" fill="#C"/>`],
    ["Bază", () => `<rect x="${MID - 52}" y="${B + 10}" width="104" height="14" rx="7" fill="#C"/>`],
    ["Punct jos", w => `<circle cx="${MID}" cy="${B + 22}" r="${f(w * .32)}" fill="#C"/>`],
  ]},
  caps: { label: "Capete sus", color: "accent", items: [
    ["Fără", () => ""],
    ["Noduri", w => [L + w / 2, R - w / 2].map(x => `<circle cx="${f(x)}" cy="${T}" r="${f(w * .62)}" fill="#C"/>`).join("")],
    ["Inele", w => [L + w / 2, R - w / 2].map(x => `<circle cx="${f(x)}" cy="${T}" r="${f(w * .58)}" fill="none" stroke="#C" stroke-width="7"/>`).join("")],
    ["Bară peste", w => `<polygon points="${pts([[L + w * .1, T - w * .95], [R + w * .1, T - w * .95], [R - w * .3, T - w * .2], [L - w * .3, T - w * .2]])}" fill="#C"/>`],
    ["Steag dreapta", w => `<polygon points="${pts([[R - w * .2, T - w * .3], [R + w * 1.2 - 34, T - w * .3], [R + w * .6 - 34, T + w * .55], [R - w * .8, T + w * .55]])}" fill="#C"/>`],
    ["Săgeți", w => `<polygon points="${pts([[L - 4, T + 18], [L + w / 2, T - 16], [L + w + 4, T + 18]])}" fill="#C"/><polygon points="${pts([[R + 4, T + 18], [R - w / 2, T - 16], [R - w - 4, T + 18]])}" fill="#C"/>`],
  ]},
  mark: { label: "Accent", color: "accent", items: [
    ["Fără", () => ""],
    ["Scânteie mijloc", w => spark(MID, T + 34, w * 1.0)],
    ["Scânteie dreapta", w => spark(R - 4, B - 54, w * .85)],
    ["Scânteie + raze", w => spark(R - 34, B - 70, w * .75) + rays(R - 34, B - 70, w * .8)],
    ["Stea colț", w => spark(R + 6, T - 14, w * .7)],
    ["3 scântei", w => spark(MID, T + 30, w * .7) + spark(MID - 30, T + 62, w * .38) + spark(MID + 32, T + 66, w * .3)],
    ["Punct", w => `<circle cx="${MID}" cy="${T + 30}" r="${f(w * .5)}" fill="#C"/>`],
    ["Plus", w => `<path d="M${MID} ${f(T + 30 - w * .7)} V${f(T + 30 + w * .7)} M${f(MID - w * .7)} ${T + 30} H${f(MID + w * .7)}" stroke="#C" stroke-width="${f(w * .34)}" stroke-linecap="round"/>`],
    ["Cutie asar", w => `<g transform="translate(${MID} ${T + 34})"><polygon points="${pts([[0, -w * .9], [w * .8, -w * .45], [w * .8, w * .45], [0, w * .9], [-w * .8, w * .45], [-w * .8, -w * .45]])}" fill="#C"/><polyline points="${pts([[-w * .8, -w * .45], [0, 0], [w * .8, -w * .45]])} " fill="none" stroke="#BOX" stroke-width="4"/><line x1="0" y1="0" x2="0" y2="${f(w * .9)}" stroke="#BOX" stroke-width="4"/></g>`],
  ]},
  weight: { label: "Grosime", items: [["Fină", 24], ["Medie", 30], ["Groasă", 36], ["Masivă", 42], ["Extra", 48]].map(([n, v]) => [n, () => "", v]) },
};
const ORDER = ["container", "back", "left", "right", "notch", "caps", "mark"];

const PALETTES = {
  box: ["#191a21", "#0b0c10", "#1e1f2b", "#1e1e2e", "#f2f2f6", "#eb6f92", "#5865f2", "#ffffff"],
  left: ["#f4f4f7", "#ffffff", "#e0def4", "#cdd6f4", "#111318", "#eb6f92", "#5865f2", "#f6c177"],
  right: ["#f4f4f7", "#ffffff", "#eb6f92", "#c4a7e7", "#5865f2", "#9ccfd8", "#f6c177", "#111318"],
  accent: ["#eb6f92", "#ff7a3d", "#c4a7e7", "#5865f2", "#2dd4a3", "#f6c177", "#9ccfd8", "#ffffff"],
};
const COLOR_TABS = [["box", "Culoare container"], ["left", "Culoare braț stâng / vârf"], ["right", "Culoare braț drept"], ["accent", "Culoare accent"]];

function mirror(svg) { return `<g transform="matrix(-1 0 0 1 256 0)">${svg}</g>`; }
function spark(cx, cy, r) { const k = r * .2; return `<path d="M${f(cx)} ${f(cy - r)} C${f(cx + k)} ${f(cy - k)} ${f(cx + k)} ${f(cy - k)} ${f(cx + r)} ${f(cy)} C${f(cx + k)} ${f(cy + k)} ${f(cx + k)} ${f(cy + k)} ${f(cx)} ${f(cy + r)} C${f(cx - k)} ${f(cy + k)} ${f(cx - k)} ${f(cy + k)} ${f(cx - r)} ${f(cy)} C${f(cx - k)} ${f(cy - k)} ${f(cx - k)} ${f(cy - k)} ${f(cx)} ${f(cy - r)}Z" fill="#C"/>`; }
function rays(cx, cy, w) { return [[-60, 1.6], [-20, 1.9], [20, 1.5]].map(([deg, len]) => { const a = deg * Math.PI / 180, r0 = w * 1.2, r1 = w * len * 1.3; return `<line x1="${f(cx + Math.cos(a) * r0)}" y1="${f(cy + Math.sin(a) * r0)}" x2="${f(cx + Math.cos(a) * r1)}" y2="${f(cy + Math.sin(a) * r1)}" stroke="#C" stroke-width="${f(w * .22)}" stroke-linecap="round"/>`; }).join(""); }

// ── State ──────────────────────────────────────────────────────────────────────────────────
const BASE = { container: 1, back: 0, left: 0, right: 5, notch: 0, caps: 0, mark: 3, weight: 2, box: "#191a21", leftc: "#f4f4f7", rightc: "#eb6f92", accent: "#eb6f92", gradient: true,
  layout: 0, font: 0, tstyle: 3, word: "vencord custom", tag: "redistributed · improved", wordc: "#f4f4f7" };

// ── Logo (icon + wordmark) ─────────────────────────────────────────────────────────────────
const FONTS = [
  ["Sans bold", "system-ui, -apple-system, 'Segoe UI', sans-serif", 700, .56],
  ["Geometric", "'Century Gothic', Futura, 'Avenir Next', 'URW Gothic', sans-serif", 700, .6],
  ["Rotunjit", "ui-rounded, 'Nunito', 'Varela Round', 'Arial Rounded MT Bold', sans-serif", 800, .58],
  ["Mono", "'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace", 700, .62],
  ["Condensed", "Bahnschrift, 'Roboto Condensed', 'Arial Narrow', sans-serif", 700, .52],
  ["Serif", "Georgia, 'Iowan Old Style', serif", 700, .55],
  ["Light", "system-ui, -apple-system, 'Segoe UI', sans-serif", 300, .54],
];
const TSTYLES = ["minuscule", "Titlu", "MAJUSCULE RARE", "Două tonuri", "Prima literă accent", "Al doilea cuvânt subțire"];
const LAYOUTS = ["Orizontal", "Stivuit", "Doar text", "Iconă mică + text", "Badge", "Text + iconă dreapta"];
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/** Wordmark as <text> with tspans; returns [markup, approximate width]. */
function wordmark(s, x, y, size, anchor = "start") {
  const [, family, weight, ratio] = FONTS[s.font];
  let text = s.word, spacing = -size * .02;
  if (s.tstyle === 0) text = text.toLowerCase();
  if (s.tstyle === 1) text = text.replace(/\b\w/g, c => c.toUpperCase());
  if (s.tstyle === 2) { text = text.toUpperCase(); spacing = size * .12; }
  const words = text.split(" ");
  let spans;
  if (s.tstyle === 3) spans = words.map((w, i) => `<tspan fill="${i ? s.accent : s.wordc}"${i ? ` dx="${f(size * .26)}"` : ""}>${esc(w)}</tspan>`).join("");
  else if (s.tstyle === 4) spans = `<tspan fill="${s.accent}">${esc(text[0])}</tspan>${esc(text.slice(1))}`;
  else if (s.tstyle === 5) spans = words.map((w, i) => `<tspan font-weight="${i ? 300 : weight}"${i ? ` dx="${f(size * .26)}"` : ""}>${esc(w)}</tspan>`).join("");
  else spans = esc(text);
  const width = text.length * size * (s.tstyle === 2 ? ratio + .22 : ratio) * 1.08;
  return [`<text x="${f(x)}" y="${f(y)}" text-anchor="${anchor}" font-family="${family.replace(/"/g, "'")}" font-weight="${weight}" font-size="${f(size)}" letter-spacing="${f(spacing)}" fill="${s.wordc}">${spans}</text>`, width];
}
function tagline(s, x, y, size, anchor = "start") {
  if (!s.tag) return ["", 0];
  return [`<text x="${f(x)}" y="${f(y)}" text-anchor="${anchor}" font-family="${FONTS[s.font][1].replace(/"/g, "'")}" font-size="${f(size)}" letter-spacing="${f(size * .06)}" fill="${s.wordc}" opacity=".6">${esc(s.tag)}</text>`, s.tag.length * size * .56];
}
const inner = s => svg(s, 256).replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "");

/** Full logo lockup. Height `h` in pixels; width follows the text. */
function lockup(s, h = 80) {
  const icon = (x, y, size) => `<g transform="translate(${f(x)} ${f(y)}) scale(${f(size / 256 * 1000) / 1000})">${inner(s)}</g>`;
  let body, W, H;
  switch (s.layout) {
    case 1: { // stacked
      const [t, tw] = wordmark(s, 0, 300, 64, "middle"); const [g, gw] = tagline(s, 0, 344, 26, "middle");
      W = Math.max(256, tw, gw) + 40; H = s.tag ? 360 : 320;
      body = icon(W / 2 - 110, 0, 220) + t.replace('x="0"', `x="${f(W / 2)}"`) + g.replace('x="0"', `x="${f(W / 2)}"`);
      break;
    }
    case 2: { const [t, tw] = wordmark(s, 0, 92, 96); const [g, gw] = tagline(s, 4, 140, 30); W = Math.max(tw, gw) + 10; H = s.tag ? 156 : 120; body = t + g; break; }
    case 3: { const [t, tw] = wordmark(s, 76, 58, 56); W = 76 + tw + 10; H = 80; body = icon(0, 6, 64) + t; break; }
    case 4: { // badge
      const [t, tw] = wordmark(s, 150, 104, 60); const [g] = tagline(s, 152, 140, 22);
      W = 150 + tw + 46; H = 180;
      body = `<rect width="${f(W)}" height="${H}" rx="40" fill="${s.box}"/>` + icon(18, 26, 128).replace(/<rect x="6"[^>]*\/>|<circle cx="128" cy="128" r="122"[^>]*\/>/, "") + t + g;
      break;
    }
    case 5: { const [t, tw] = wordmark(s, 0, 112, 84); const [g, gw] = tagline(s, 4, 152, 28); const w = Math.max(tw, gw); W = w + 190; H = 180; body = t + g + icon(w + 24, 6, 168); break; }
    default: { const [t, tw] = wordmark(s, 196, 112, 84); const [g, gw] = tagline(s, 200, 152, 28); W = 196 + Math.max(tw, gw) + 10; H = 180; body = icon(0, 6, 168) + t + g; }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${f(W)} ${f(H)}" height="${h}" width="${f(h * W / H)}">${body}</svg>`;
}
const KEY = "vBrandStudio";
let S = { ...BASE, ...load("cur") };
const fromHash = new URLSearchParams(location.hash.slice(1));
if (fromHash.size) for (const [k, v] of fromHash) if (k in BASE) S[k] = typeof BASE[k] === "number" ? Number(v) : typeof BASE[k] === "boolean" ? v === "true" : v;
let hist = [];
let tab = load("tab") || "left";
let saved = load("saved") || [null, null, null, null, null];
let focus = true, lightBg = false, uid = 0;
function load(k) { try { return JSON.parse(localStorage[KEY + k]); } catch { return null; } }
function store() { localStorage[KEY + "cur"] = JSON.stringify(S); localStorage[KEY + "tab"] = JSON.stringify(tab); localStorage[KEY + "saved"] = JSON.stringify(saved); }

function colorFor(part, s) { return { box: s.box, left: s.leftc, right: s.rightc, accent: s.accent }[PARTS[part].color]; }

/** Full mark. `dim` = part to keep at full opacity while others fade (gallery focus). */
function svg(s, size = 256, dim) {
  const u = "g" + (uid++);
  const w = PARTS.weight.items[s.weight][2];
  let defs = "";
  const paint = (part, c) => {
    if (s.gradient && part !== "container" && (c === s.accent || c === s.rightc) && c !== s.leftc) {
      defs += `<linearGradient id="${u}${part}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${shade(c, -.3)}"/></linearGradient>`;
      return `url(#${u}${part})`;
    }
    return c;
  };
  const body = ORDER.map(part => {
    let g = PARTS[part].items[s[part]][1](w).replaceAll("#C", paint(part, colorFor(part, s))).replaceAll("#BOX", s.box);
    if (PARTS[part].mirrored) g = mirror(g);
    if (dim && part !== dim && part !== "container" && g) g = `<g opacity=".18">${g}</g>`;
    return g;
  }).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="${size}" height="${size}">${defs ? `<defs>${defs}</defs>` : ""}${body}</svg>`;
}
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); return "#" + [n >> 16, n >> 8 & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v + (a < 0 ? v : 255 - v) * a))).toString(16).padStart(2, "0")).join(""); }

// ── Rendering ──────────────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function set(patch) { hist.push({ ...S }); if (hist.length > 100) hist.shift(); Object.assign(S, patch); draw(); }

function draw() {
  $("cur").innerHTML = svg(S, 200);
  $("cur").style.background = lightBg ? "#f2f2f6" : "";
  $("logo-dark").innerHTML = lockup(S, 120);
  $("logo-light").innerHTML = lockup(onLight(S), 120);
  $("sizes").innerHTML = [16, 24, 32, 48, 64, 96].map(n => `<figure>${svg(S, n)}<figcaption>${n}</figcaption></figure>`).join("");
  $("tabs").innerHTML = [...ORDER, "weight", "__colors", ...LOGO_TABS.map(t => t[0])].map(k => `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${k === "__colors" ? "Culori" : LOGO_TAB[k]?.[1] ?? PARTS[k].label}</button>`).join("");
  $("saved").innerHTML = saved.map((s, i) => `<div class="slot" data-i="${i}" title="${s ? "Încarcă" : "Salvează aici"}">${s ? svg(s, 56) + `<button class="x" data-del="${i}">✕</button>` : "<span>★</span>"}</div>`).join("");
  $("focus").classList.toggle("on", focus);
  $("bgmode").textContent = lightBg ? "Fundal: deschis" : "Fundal: întunecat";
  $("compare").innerHTML = [["Curent", S], ...saved.map((s, i) => s && [`#${i + 1}`, s]).filter(Boolean)].map(([n, s]) =>
    `<div class="cmp"><div class="pair"><div class="dark">${svg(s, 92)}</div><div class="light">${svg(s, 92)}</div></div><div class="lk dark" style="min-height:0;padding:8px">${lockup(s, 46)}</div>${n}</div>`).join("");
  drawGrid();
  history.replaceState(null, "", "#" + new URLSearchParams(Object.entries(S).map(([k, v]) => [k, String(v)])));
  store();
}

function drawGrid() {
  $("custom").innerHTML = "";
  $("grid").classList.toggle("wide", tab in LOGO_TAB);
  if (tab in LOGO_TAB) {
    const [, label, list] = LOGO_TAB[tab];
    $("hint").textContent = `${label}: alege; iconița rămâne cea compusă de tine.`;
    $("custom").innerHTML = `<label>Text <input type="text" data-text="word" value="${esc(S.word)}"></label> · <label>Slogan <input type="text" data-text="tag" value="${esc(S.tag)}"></label> · <label>Culoare text <input type="color" data-text="wordc" value="${S.wordc}"></label>`;
    $("grid").innerHTML = list.map((name, i) =>
      `<div class="opt ${S[tab] === i ? "on" : ""}" data-pick="${i}"><div class="lkc">${lockup({ ...S, [tab]: i }, 90)}</div><small>${name}</small></div>`).join("");
    return;
  }
  if (tab === "__colors") {
    $("hint").textContent = "Click pe o culoare o aplică elementului; selectorul din dreapta acceptă orice culoare. Gradient = accent și braț drept cu degrade.";
    $("custom").innerHTML = COLOR_TABS.map(([k, n]) => `<label>${n} <input type="color" data-color="${k}" value="${cval(k)}"></label>`).join(" · ") +
      ` · <label><input type="checkbox" id="grad" ${S.gradient ? "checked" : ""}> Gradient</label>`;
    $("grid").innerHTML = COLOR_TABS.flatMap(([k, n]) => PALETTES[k].map(c =>
      `<div class="opt ${cval(k) === c ? "on" : ""}" data-set-color="${k}" data-value="${c}"><div class="swatch" style="background:${k === "box" ? "transparent" : "#0b0c10"}">${svg({ ...S, ...colorPatch(k, c) }, 96)}</div><small>${n}<br>${c}</small></div>`)).join("");
    return;
  }
  const part = PARTS[tab];
  $("hint").textContent = tab === "weight" ? "Grosimea tuturor elementelor." : `${part.label}: ${part.items.length} variante. Restul logo-ului rămâne cum l-ai ales${focus ? " (estompat ca să vezi elementul)" : ""}.`;
  $("grid").innerHTML = part.items.map((item, i) =>
    `<div class="opt ${S[tab] === i ? "on" : ""}" data-pick="${i}">${svg({ ...S, [tab]: i }, 120, focus && tab !== "weight" ? tab : null)}<small>${item[0]}</small></div>`).join("");
}
const cval = k => ({ box: S.box, left: S.leftc, right: S.rightc, accent: S.accent })[k];
const LOGO_TABS = [["layout", "Logo: aranjare", LAYOUTS], ["font", "Logo: font", FONTS.map(x => x[0])], ["tstyle", "Logo: stil text", TSTYLES]];
const LOGO_TAB = Object.fromEntries(LOGO_TABS.map(t => [t[0], t]));
/** Light-background variant: light text turns dark so the wordmark stays readable. */
function onLight(s) { const n = parseInt(s.wordc.slice(1), 16); const lum = (n >> 16) * .3 + (n >> 8 & 255) * .59 + (n & 255) * .11; return lum > 150 ? { ...s, wordc: "#16171d" } : s; }
const colorPatch = (k, c) => ({ box: { box: c }, left: { leftc: c }, right: { rightc: c }, accent: { accent: c } })[k];

// ── Events ─────────────────────────────────────────────────────────────────────────────────
$("tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; draw(); } };
$("grid").onclick = e => {
  const pick = e.target.closest("[data-pick]"); if (pick) return set({ [tab]: Number(pick.dataset.pick) });
  const col = e.target.closest("[data-set-color]"); if (col) set(colorPatch(col.dataset.setColor, col.dataset.value));
};
$("custom").oninput = e => {
  if (e.target.dataset.color) set(colorPatch(e.target.dataset.color, e.target.value));
  if (e.target.id === "grad") set({ gradient: e.target.checked });
  if (e.target.dataset.text) { Object.assign(S, { [e.target.dataset.text]: e.target.value }); $("logo-dark").innerHTML = lockup(S, 120); $("logo-light").innerHTML = lockup(onLight(S), 120); store(); }
};
$("custom").onchange = e => { if (e.target.dataset.text) set({}); };
$("saved").onclick = e => {
  const del = e.target.closest("[data-del]"); if (del) { saved[del.dataset.del] = null; return draw(); }
  const slot = e.target.closest("[data-i]"); if (!slot) return;
  const i = slot.dataset.i; if (saved[i]) set({ ...saved[i] }); else { saved[i] = { ...S }; draw(); }
};
$("undo").onclick = () => { if (hist.length) { S = hist.pop(); draw(); } };
document.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("undo").click(); } };
$("reset").onclick = () => set({ ...BASE });
$("random").onclick = () => set(Object.fromEntries([...ORDER, "weight"].map(k => [k, Math.floor(Math.random() * PARTS[k].items.length)])));
$("focus").onclick = () => { focus = !focus; draw(); };
$("bgmode").onclick = () => { lightBg = !lightBg; draw(); };
const download = (name, blob) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$("svg").onclick = () => download("v-icon.svg", new Blob([svg(S)], { type: "image/svg+xml" }));
$("copy").onclick = () => navigator.clipboard.writeText(svg(S));
$("link").onclick = () => navigator.clipboard.writeText(location.href);
$("png").onclick = () => toPng(svg(S, 1024), 1024, 1024, "v-icon.png");
$("lsvg").onclick = () => download("v-logo.svg", new Blob([lockup(S, 180)], { type: "image/svg+xml" }));
$("lpng").onclick = () => { const l = lockup(S, 360); const w = Number(l.match(/width="([\d.]+)"/)[1]); toPng(l, Math.round(w), 360, "v-logo.png"); };
function toPng(markup, w, h, name) { const img = new Image(); img.onload = () => { const c = Object.assign(document.createElement("canvas"), { width: w, height: h }); c.getContext("2d").drawImage(img, 0, 0, w, h); c.toBlob(b => download(name, b)); }; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup); }
draw();
</script>
</body>
</html>
