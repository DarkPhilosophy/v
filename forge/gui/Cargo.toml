[package]
name = "vencord-forge"
description = "Vencord Forge: pick plugins, patches and OpenAsar, then build and install Vencord into Discord."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
forge-core.workspace = true
vforge = { path = "../cli" }
anyhow.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
egui = "0.33"
png = "0.17"
resvg = { version = "0.45", default-features = false }

[build-dependencies]
resvg = { version = "0.45", default-features = false }
ico = "0.4"
winresource = "0.1"
